# Production: `docker compose up -d` on the server (see DEPLOIEMENT.md).
# Local test: DOMAINE=localhost in .env, then `docker compose up -d --build`.
name: a11y-check

services:
  app:
    image: ghcr.io/fabricelago/a11y-check:${VERSION:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: https://${DOMAINE:?Renseignez DOMAINE dans .env}
    volumes:
      - donnees:/app/server/data
    # Chromium: shared memory for rendering, reaping of its processes, and its own sandbox
    # (Playwright's seccomp profile = Docker's default + the calls Chromium's sandbox needs).
    shm_size: 1gb
    init: true
    security_opt:
      - seccomp=./docker/seccomp-chromium.json
      - no-new-privileges:true
    # Lets running scans finish on `docker compose down` / updates (paid orders resume anyway).
    stop_grace_period: 60s
    # Not published on the host: only Caddy talks to it.
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAINE: ${DOMAINE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # SQLite database, delivered PDFs, daily backups (data/sauvegardes).
  donnees:
  # HTTPS certificates: keep this volume, or Let's Encrypt will issue new ones at each start.
  caddy_data:
  caddy_config:
