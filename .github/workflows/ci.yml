name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  server:
    name: Serveur (types + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Cache Chromium (Playwright)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      # SSRF, analysis on a local fixture site, translation, score, API, e-mail/consent,
      # payment (Stripe mocked), tagged PDF, axe on e-mails / link pages / PDF template.
      - run: npm test

  web:
    name: Front (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build

  a11y:
    name: Audit d'accessibilité (axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Cache Chromium (Playwright)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Every screen × light/dark × 1280/390 px, API mocked: one violation fails the build.
      - run: npm run audit:a11y
      - name: Rapport d'audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-accessibilite
          path: web/a11y-rapport.json
          if-no-files-found: ignore

  image:
    name: Image Docker (GHCR)
    # Only a main branch that passed every check is published.
    needs: [server, web, a11y]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fabricelago/a11y-check
          # "latest" for normal updates, "sha-<commit>" to roll back to a precise version.
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
